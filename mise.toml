[tools]
air = "1.67.4"          # backend: live-reloading
bun = "1.4.2"          # frontend uses Svelte with Wails
go = "1.27.1"
"go:github.com/wailsapp/wails/v2/cmd/wails" = "2.16.0"  # must match wails/v2 in go.mod
golangci-lint = "2.14.0"

[tasks.install]
description = "Install all dependencies for Go and frontend"
run = ["go mod tidy", "cd gui/frontend && bun install"]

[tasks.dev-cli]
description = "Start the CLI app locally with live reload (Go + Air)"
run = "air"

[tasks.dev-gui]
description = "Start the GUI app locally with live reload (Wails + Svelte 5)"
# -tags webkit2_41: Ubuntu 24.04+ only ships webkit2gtk-4.1, not the 4.0 wails links against by default.
run = "cd gui && wails dev -tags webkit2_41"

[tasks.build-cli]
description = "Build the CLI into an executable"
run = "go build -o tmp/main.exe cmd/bot/main.go"

[tasks.build-gui]
description = "Build the GUI using Wails"
# -tags webkit2_41: Ubuntu 24.04+ only ships webkit2gtk-4.1, not the 4.0 wails links against by default.
run = "cd gui && wails build -tags webkit2_41"

[tasks.test]
description = "Run all go tests"
run = "go test ./..."

[tasks.fmt]
description = "Format code"
run = ["go fmt ./...", "golangci-lint fmt", "cd gui/frontend && bun run format"]

[tasks.lint]
description = "Format & lint"
run = ["golangci-lint run --fix --fast-only"]
