[tools]
go = "1.25.1"
"aqua:golangci/golangci-lint" = "2.5.0"

[tasks.setup]
description = "Setup the project"
run = [
  "go mod tidy",
  "go mod vendor",
  # "Install-Module -Name PSScriptAnalyzer -Force", # only use for .ps1 linting
]

[tasks.install]
description = "Install dependencies"
run = ["go mod tidy", "go mod vendor"]

[tasks.build]
description = "Build the app"
run = "go build -o build/main.exe cmd/lambda/main.go"

[tasks.lint]
description = "Format & lint"
run = ["golangci-lint fmt", "golangci-lint run --fix --fast-only"]

