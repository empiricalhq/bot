root = "."
tmp_dir = "tmp"

[build]
cmd = "echo 'reloading...'"
full_bin = "go run ./cmd/bot/main.go"

include_ext = ["go", "json"]
exclude_dir = ["tmp", "build", "vendor", "log"]

stop_on_error = true

delay = 1000 # ms

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
