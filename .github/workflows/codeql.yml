name: CodeQL

on:
  push:
    branches: [master]
    paths:
      - "/cmd/"
      - "/internal/"
      - "/pkg/"
  pull_request:
    paths:
      - "/cmd/"
      - "/internal/"
      - "/pkg/"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["go"]

    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - run: go build -o /dev/null ./...

      - uses: github/codeql-action/analyze@v3
