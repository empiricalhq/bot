name: golangci-lint

on:
  push:
    branches: [master]
    paths:
      - "/cmd/"
      - "/internal/"
      - "/pkg/"
  pull_request:
    branches: [master]
    paths:
      - "/cmd/"
      - "/internal/"
      - "/pkg/"
  workflow_dispatch:

jobs:
  lint:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.1
        env:
          GO111MODULE: off

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
